[package]
name = "crusade-data"
version = "0.1.0"
edition = "2021"
description = "Offline-first CRDT store for Deus Vult: roster, inventory, settings. automerge-backed."
license = "MIT"

[dependencies]
crusade-core = { path = "../crusade-core" }
automerge = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }

# wasm32-unknown-unknown: uuid needs a JS randomness source (`js`), and the
# automerge stack's getrandom 0.4 needs its wasm backend (`wasm_js`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.0", features = ["v4", "js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
