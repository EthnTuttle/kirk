[package]
name = "crusade-sim"
version = "0.1.0"
edition = "2021"
description = "Headless AI-vs-AI battle harness and balance fuzzer."
license = "MIT"

[dependencies]
crusade-core = { path = "../crusade-core" }
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"

[[bin]]
name = "crusade-sim"
path = "src/main.rs"
