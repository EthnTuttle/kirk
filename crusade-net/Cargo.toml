[package]
name = "crusade-net"
version = "0.1.0"
edition = "2021"
description = "P2P transport + turn commit-reveal duel session for Deus Vult. iroh QUIC (native), nostr-relay fallback (wasm-safe)."
license = "MIT"

[dependencies]
crusade-core = { path = "../crusade-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["sync", "macros", "rt"] }
async-trait = "0.1"

# nostr fallback transport (works in browser wasm over websockets)
nostr = { version = "0.35" }
nostr-sdk = { version = "0.35" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread"] }
iroh = { version = "1.3", optional = true }

# std::time::Instant::now() panics on wasm32-unknown-unknown; `instant`
# (already in the tree via nostr) provides a wasm-safe clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
instant = "0.1"

[features]
default = []
iroh-quic = ["dep:iroh"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
nostr-relay-builder = "0.35"
