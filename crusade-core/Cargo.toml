[package]
name = "crusade-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic battle engine and data tables for Deus Vult: Champions of the Cross. No I/O, wasm-safe."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

# Deterministic RNG: xoshiro, seeded from kirk commit-reveal output.
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3" # ChaCha8Rng: stable across platforms, wasm-safe

[dev-dependencies]
proptest = "1.0"
serde_json = "1.0"

# wasm32-unknown-unknown: proptest's rand 0.9 pulls getrandom 0.3, which
# needs its `wasm_js` backend to compile wasm test/check builds.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
