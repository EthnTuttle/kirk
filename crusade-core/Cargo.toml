[package]
name = "crusade-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic battle engine and data tables for Deus Vult: Champions of the Cross. No I/O, wasm-safe."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

# Deterministic RNG: xoshiro, seeded from kirk commit-reveal output.
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3" # ChaCha8Rng: stable across platforms, wasm-safe

[dev-dependencies]
proptest = "1.0"
