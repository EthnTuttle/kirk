[package]
name = "crusade-app"
version = "0.1.0"
edition = "2021"
description = "Client core for Deus Vult: frontend-agnostic game client API (roster, headless duels, view snapshots). Bevy shell + wasm/mobile targets land in M5b."
license = "MIT"

[features]
# M5b visual shell: the `crusade-desktop` Bevy binary. The bevy dep lists
# bevy 0.18's `default` features (=2d+3d+ui, fully expanded) MINUS `audio`
# (`bevy_audio`->cpal links ALSA, whose dev package is not available in CI).
bevy-ui = ["dep:bevy"]

[dependencies]
crusade-bridge = { path = "../crusade-bridge" }
crusade-core = { path = "../crusade-core" }
crusade-data = { path = "../crusade-data" }
crusade-net = { path = "../crusade-net" }
# Workspace-internal kirk crate (already in this crate's graph via
# crusade-bridge): lobby reuses its 9259/9260/9261 builders & parsers.
kirk = { path = ".." }
hex = "0.4"
nostr = "0.35"
# Relay client for the lobby; already declared by crusade-net (same version,
# wasm-safe websockets) — no new external package enters the tree.
nostr-sdk = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
# The Bevy shell's ONE async boundary: lobby/duel task channels + select.
# tokio is already in the tree (crusade-net depends on these same
# features); nothing new enters the dependency graph.
tokio = { version = "1.0", features = ["sync", "macros", "rt"] }
# async-trait backs the bevy shell's two `crusade_net::zaps::Http` impls
# (browser fetch on wasm; the desktop's no-HTTPS stub) — the exact package
# crusade-net already compiles; nothing new enters the graph.
async-trait = "0.1"
bevy = { version = "0.18", optional = true, default-features = false, features = [
    "default_app",
    "default_platform",
    "ui_api",
    "ui_bevy_render",
    "2d_bevy_render",
    "3d_bevy_render",
    "scene",
    "picking",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser persistence shim (`persist`): roster doc in localStorage.
# The Request*/Response features serve the battle-over alms flow (B3b):
# browser `fetch` is the shell's HTTPS transport for crusade-net's zaps
# module — same web-sys package, feature flags only.
web-sys = { version = "0.3", features = [
    "Storage",
    "Window",
    "Request",
    "RequestInit",
    "RequestRedirect",
    "Response",
] }
# Task spawn for the lobby/duel bridge — the same executor nostr-sdk's own
# wasm glue uses (transitively present via async-utility on wasm already).
wasm-bindgen-futures = "0.4"
# JsCast for reading the fetch Response body — the very crate web-sys's own
# glue is built on; nothing new enters the graph.
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The shell's single net task runs on one shared multi-thread runtime
# (NostrTransport's retry path needs a tokio context); native-only.
tokio = { version = "1.0", features = ["rt-multi-thread"] }

[[bin]]
name = "crusade-desktop"
path = "src/bevy_shell/main.rs"
required-features = ["bevy-ui"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
# Embedded relay fixture for lobby tests (same dev-dep crusade-net uses).
nostr-relay-builder = "0.35"
