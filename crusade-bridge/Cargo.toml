[package]
name = "crusade-bridge"
version = "0.1.0"
edition = "2021"
description = "Binding between kirk (cashu/nostr trust protocol) and crusade-core/net: commit-reveal battle seeds, transcript attestation, wager plumbing."
license = "MIT"

[dependencies]
crusade-core = { path = "../crusade-core" }
crusade-net = { path = "../crusade-net" }
kirk = { path = ".." }
# V12-2 wager escrow: NUT-11 locks + swaps go through the CDK mint handle
# directly; same path-pinned crates kirk already puts in the graph.
cdk = { path = "../deps/cdk/crates/cdk" }
cashu = { path = "../deps/cdk/crates/cashu", features = ["kirk"] }
nostr = "0.35"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
# In-memory CDK mint for escrow end-to-end tests (the GameMint::new_test
# precedent): native-only, never in the app/wasm graph.
cdk-sqlite = { path = "../deps/cdk/crates/cdk-sqlite" }
cdk-signatory = { path = "../deps/cdk/crates/cdk-signatory", default-features = false }
