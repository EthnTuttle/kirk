[package]
name = "crusade-bridge"
version = "0.1.0"
edition = "2021"
description = "Binding between kirk (cashu/nostr trust protocol) and crusade-core/net: commit-reveal battle seeds, transcript attestation, wager plumbing."
license = "MIT"

[dependencies]
crusade-core = { path = "../crusade-core" }
crusade-net = { path = "../crusade-net" }
kirk = { path = ".." }
nostr = "0.35"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
